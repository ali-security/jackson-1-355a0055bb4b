name: seal-build

# Upstream (FasterXML/jackson-1, 1.9 branch) has no GitHub Actions CI; it is
# built and tested with Apache Ant (build.xml + ant/build-test.xml).
# The 1.9.2 release jar was built on JDK 1.6 (Created-By: 1.6.0_26), so the
# build and the test suite both run on a JDK 6 (Zulu) with Ant 1.8.4.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated fully qualified test class names; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 6 (Zulu) and Ant 1.8.4
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
          sudo tar -C /opt -xzf zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
          curl -fsSLO https://archive.apache.org/dist/ant/binaries/apache-ant-1.8.4-bin.tar.gz
          sudo tar -C /opt -xzf apache-ant-1.8.4-bin.tar.gz
          echo "JAVA_HOME=/opt/zulu6.22.0.3-jdk6.0.119-linux_x64" >> "$GITHUB_ENV"
          echo "ANT_HOME=/opt/apache-ant-1.8.4" >> "$GITHUB_ENV"
          echo "/opt/zulu6.22.0.3-jdk6.0.119-linux_x64/bin" >> "$GITHUB_PATH"
          echo "/opt/apache-ant-1.8.4/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          java -version
          ant -version

      - name: Build jars
        run: ant clean jars.asl

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          if [ -n "${TEST_FILTER}" ]; then
            for t in ${TEST_FILTER}; do
              ant test.single -Dtest="$t"
            done
          else
            ant test
          fi

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tot = fail = err = skip = 0
          for f in sorted(glob.glob("test/results/xml/TEST-*.xml")):
              r = ET.parse(f).getroot()
              t, fl, e = int(r.get("tests", 0)), int(r.get("failures", 0)), int(r.get("errors", 0))
              s = int(r.get("skipped", 0) or 0)
              tot += t; fail += fl; err += e; skip += s
              print(f"{r.get('name')}: tests={t} failures={fl} errors={e}")
          print(f"TOTAL tests={tot} passed={tot - fail - err - skip} failures={fail} errors={err} skipped={skip}")
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jackson-mapper-asl
          path: build/jackson-mapper-asl-*.jar
          if-no-files-found: error
